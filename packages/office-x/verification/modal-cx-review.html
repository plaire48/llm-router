<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>누비 Office 폼 개선</title><style>body{margin:0;padding:32px;background:#F1F7FE;color:#191F28;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}main{max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:32px 0 12px}p{font-size:15px;color:#4E5968;margin:0 0 20px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border-radius:16px}figcaption{font-size:14px;font-weight:500;margin:8px 0;color:#4E5968}.after{color:#1B64DA}.note{margin-top:32px;font-size:14px}@media(max-width:550px){body{padding:16px}.pair{gap:12px}}</style><main><h1>누비 Office 폼 개선</h1><p>Workspace의 폰트, 색상, 간격을 기준으로 세 Office 앱의 폼을 맞췄습니다.</p><h2>모델 선택</h2><p>긴 이름과 문맥 정보는 두 줄로 읽고, 선택 항목과 적용 버튼을 강조합니다.</p><div class="pair"><figure><figcaption>변경 전</figcaption><img src="modal-model-before.png" alt="변경 전 모델 선택 폼"></figure><figure><figcaption class="after">변경 후</figcaption><img src="modal-models-420-confirmed.png" alt="Workspace 공통 스타일을 반영한 모델 선택 폼"></figure></div><h2>웹 검색 연결</h2><p>필드 간격과 하단 취소·저장 버튼을 통일했습니다.</p><div class="pair"><figure><figcaption>변경 전</figcaption><img src="modal-search-before.png" alt="변경 전 웹 검색 연결 폼"></figure><figure><figcaption class="after">변경 후</figcaption><img src="modal-search-420-confirmed.png" alt="변경 후 웹 검색 연결 폼"></figure></div><h2>좁은 창에서도</h2><div class="pair"><figure><figcaption>문서 선택 280px</figcaption><img src="modal-target-280-confirmed.png" alt="제목과 설명이 줄바꿈되는 280px 문서 선택 화면"></figure><figure><figcaption>FabriX 연결 320px</figcaption><img src="modal-fabrix-320-confirmed.png" alt="짧은 320px 창의 FabriX 연결 화면"></figure></div><p class="note">브라우저의 모의 WebView 화면입니다. 실제 Windows Office 2016 화면의 검증은 남아 있습니다.</p></main></html>
