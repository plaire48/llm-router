name: Office X Windows Beta
on:
  push:
    branches: ['codex/nubi-office-genoffice-0.3.0']
    paths: ['packages/office-x/**', '.github/workflows/office-x-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-com:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/office-x
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native COM dispatch in both Office process architectures
        run: |
          foreach($architecture in @('x64','x86')){
            dotnet build native/OfficeX.Dispatch.Tests -c Release -p:PlatformTarget=$architecture
            if($LASTEXITCODE){throw 'Native COM regression compile failed'}
            & native/OfficeX.Dispatch.Tests/bin/Release/net472/OfficeX.Dispatch.Tests.exe
            if($LASTEXITCODE){throw "Native COM regression failed ($architecture)"}
          }
  windows:
    needs: native-com
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/office-x
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: NuGet/setup-nuget@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows installer
        run: ./scripts/Build-Windows.ps1 -InstallBuildTools
      - name: Install, reinstall and uninstall
        run: ./scripts/Test-WindowsInstall.ps1
      - name: Package source
        run: |
          python scripts/package-source.py
          Copy-Item artifacts/* releases/
      - name: Preserve build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-x-windows-verification
          retention-days: 7
          path: |
            packages/office-x/verification/companion-*.json
            packages/office-x/verification/native-*.json
            packages/office-x/releases/installer-build.json
            packages/office-x/releases/install-smoke.json
      - name: Stage release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          $tag="office-x-v$version-beta.1"
          $existingDraft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if($LASTEXITCODE -eq 0 -and $existingDraft -eq 'false'){throw 'Published releases are immutable. Bump the package version.'}
          if($LASTEXITCODE){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Nubi Agent Office $version Beta 1" --notes-file RELEASE-NOTES.md}
          if($LASTEXITCODE){throw 'Release creation failed'}
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file RELEASE-NOTES.md
          if($LASTEXITCODE){throw 'Draft target update failed'}
          gh release upload $tag "releases/Nubi-Office-X-$version-Setup.exe" "releases/Nubi-Office-X-$version-Setup.exe.sha256" "releases/office-x-$version-source.zip" "releases/office-x-$version-source.json" releases/installer-build.json releases/install-smoke.json --clobber --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE){throw 'Release upload failed'}
