appId: nubi.workspace
productName: 누비 Workspace
executableName: Nubi Workspace
artifactName: Nubi-Workspace-beta-${version}-${arch}-Setup.${ext}
electronVersion: 42.11.10
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/@vscode/ripgrep-*/**/*
  - "**/*.node"
npmRebuild: false
nodeGypRebuild: false
directories:
  output: ../release/windows
  buildResources: resources
files:
  - "!node_modules/node-pty/**/*.pdb"
  - "!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**/*"
  - "!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**/*"
  - lib/**/*
  - launcher.cjs
  - package.json
extraResources:
  - from: resources/git
    to: git
  - from: resources/nubi.png
    to: nubi-icon.png
  - from: ../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: ../vendor/licenses
    to: licenses
win:
  icon: resources/nubi.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: nubi-installer.nsh
  installerHeader: nsis-generated/installer-header.bmp
  installerSidebar: nsis-generated/installer-sidebar.bmp
  uninstallerSidebar: nsis-generated/installer-sidebar.bmp
  installerLanguages: [ko_KR]
  language: "1042"
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 누비 Workspace
  uninstallDisplayName: 누비 Workspace Beta ${version}
publish: null
