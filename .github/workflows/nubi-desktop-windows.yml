name: Nubi Desktop Windows installer
on:
  push:
    branches: ['codex/nubi-desktop-windows-release*']
  workflow_dispatch:
permissions:
  # contents: write publishes the verified files to a draft release (Actions artifact storage can be full).
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
      - name: Verify Unicode shortcut inspection
        shell: pwsh
        run: ./scripts/Test-ShellLink.ps1
      - name: Verify native virtual cursor shape and user pointer isolation
        run: node scripts/check-visual-pointer.mjs
      - name: Verify real RunAs and elevated child exit before dependency installation
        run: node scripts/check-elevation.mjs
      - name: Install locked dependencies
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The shared runtime imports OpenWiki-SDS source at run time (agent-runtime -> openwiki-agent -> wiki-question.ts),
      # and the OpenWiki update runner is bundled from it: install its locked dependencies as in development.
      - name: Install OpenWiki-SDS locked dependencies
        working-directory: packages/openwiki
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile runtime and check contracts
        run: |
          New-Item verification -ItemType Directory -Force | Out-Null
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        id: driver-cache
        with:
          path: packages/nubi-desktop/generated/winapp
          key: winapp-x64-d626d2b53b9eea27ae2972e9153ce0b1d4c52825-password-v1
      - uses: actions/checkout@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          repository: microsoft/winappCli
          ref: d626d2b53b9eea27ae2972e9153ce0b1d4c52825
          path: .build/winapp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare verified Windows driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/prepare-winapp.ps1
      - uses: actions/cache/save@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          path: packages/nubi-desktop/generated/winapp
          key: winapp-x64-d626d2b53b9eea27ae2972e9153ce0b1d4c52825-password-v1
      - name: Verify real Windows UIA
        run: |
          node scripts/check-winapp.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify host app launch, approved draft and native shells
        run: node scripts/check-windows-workflow.mjs
      - name: Build Windows installer
        run: npm run package:windows
      - name: Preserve candidate for reproducible installer diagnostics
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nubi-unverified-windows-candidate
          path: packages/nubi-desktop/release/windows/*-Setup.exe
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Download previous verified installer for upgrade coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'nubi-desktop-baseline'
          gh run download 35870591663 --repo plaire48/llm-router --name nubi-workspace-windows-x64 --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = Join-Path $baseline 'release/windows/Nubi-Workspace-beta-1.0.0-x64-Setup.exe'
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLower() -ne '2cf070446d301a20e57b0722a8fa15400f6e18947b1f3c63813dc379a45ea59e') { throw 'Baseline checksum mismatch' }
          "NUBI_BASELINE_INSTALLER=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install and verify packaged application
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1
      # The verified files go to a draft release of this run: Actions artifact storage of the account was full
      # (2026-09-30), and a draft is not public. The files are then published to AI Workspace.
      - name: Publish verified installer to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "nubi-desktop-v$version-run-$env:GITHUB_RUN_ID"
          $reports = 'electron-release.json','windows-installer.json','windows-branding.json','installed-icon.png','windows-uia.json','windows-uia-visual-only.json','windows-elevation.json','windows-workflow.json' | ForEach-Object { (Resolve-Path (Join-Path 'verification' $_)).Path }
          $files = @((Get-ChildItem release/windows/*-Setup.exe).FullName) + @((Get-ChildItem release/windows/*.sha256).FullName) + $reports
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --prerelease --target $env:GITHUB_SHA --title "Nubi workspace $version, verified Windows run $env:GITHUB_RUN_ID" --notes "Installer and reports of Windows run $env:GITHUB_RUN_ID for commit $env:GITHUB_SHA." @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nubi-windows-diagnostics
          path: packages/nubi-desktop/verification/
