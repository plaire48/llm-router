name: Nubi Desktop Windows installer
on:
  push:
    branches: ['codex/nubi-desktop-windows-release*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix ../nubi-a2a --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install OpenWiki-SDS locked dependencies
        working-directory: packages/openwiki
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows lifecycle and secure connection storage
        run: |
          node --test tests/connection-vault.test.mjs tests/electron-lifecycle.test.mjs tests/connection-readiness.test.mjs tests/model-catalog-refresh.test.mjs tests/project-catalog.test.mjs tests/titlebar-colors.test.mjs tests/git-runtime.test.mjs tests/claude-stream.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test ../nubi-vscode/tests/ghes-account.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Unicode shortcut inspection
        shell: pwsh
        run: |
          ./scripts/Test-ShellLink.ps1
          Add-Type -Path scripts/InstallerWindow.cs
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Publish-NubiUpdate.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Build standalone Electron installer with bird icon
        run: npm run package:windows
      - name: Verify Nubi skill scope and manual external file browsing
        run: |
          node --test tests/agent-capabilities.test.mjs tests/skill-import.test.mjs tests/skill-marketplace.test.mjs tests/local-file-view.test.mjs tests/workspace-updater.test.mjs tests/agent-question-placeholder.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PowerShell Korean text and command follow-up admission
        run: |
          node --test --test-concurrency=1 tests/shell-encoding.test.mjs tests/submit-task-message.test.mjs tests/agent-input.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged project navigation before installation
        run: |
          $env:NUBI_TEST_EXECUTABLE = (Resolve-Path 'release/windows/win-unpacked/Nubi Workspace.exe').Path
          $env:NUBI_TEST_WITHOUT_GIT = '1'
          node scripts/check-electron-shell.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-electron-projects.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify body-only mail Beta scope
        run: |
          node --test tests/mail-beta-scope.test.mjs tests/mail-search.test.mjs tests/mail-connection-errors.test.mjs tests/mail-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native OpenWiki initialization and update bridge
        run: |
          New-Item verification -ItemType Directory -Force | Out-Null
          $node = (Get-Command node).Source
          $previousPath = $env:Path
          $env:NUBI_BUNDLED_GIT = (Resolve-Path 'release/windows/win-unpacked/resources/git/cmd/git.exe').Path
          $env:Path = (Split-Path $env:NUBI_BUNDLED_GIT) + ';' + (Split-Path $node) + ';' + $env:SystemRoot + '\System32'
          & $node --test tests/wiki-initialization-flow.test.mjs tests/wiki-update-bundle.test.mjs tests/wiki-update.test.mjs tests/wiki-update-view.test.mjs 2>&1 | Tee-Object -FilePath verification/windows-wiki-tests.log
          $wikiExit = $LASTEXITCODE
          $env:Path = $previousPath
          Remove-Item Env:NUBI_BUNDLED_GIT
          if ($wikiExit -ne 0) { exit $wikiExit }
      - name: Download verified upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'nubi-desktop-baseline'
          New-Item $baseline -ItemType Directory -Force | Out-Null
          gh release download nubi-desktop-v1.1.0-run-36651590466 --repo $env:GITHUB_REPOSITORY --pattern '*-Setup.exe' --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = (Get-ChildItem $baseline/*-Setup.exe | Select-Object -First 1).FullName
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLower() -ne '107933dc1fdb19e3949a0817ee89bff2d330d209e1d04551b0248c48dd1c4e86') { throw 'Baseline checksum mismatch' }
          "NUBI_BASELINE_INSTALLER=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed app, icon, upgrade, reinstall and uninstall
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1
      - name: Save verified installer and reports in a private draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "nubi-desktop-v$version-run-$env:GITHUB_RUN_ID"
          $reports = 'electron-shell.json','electron-first-install.json','electron-projects.json','electron-projects.png','electron-projects-narrow.png','windows-installer.json','windows-branding.json','installed-icon.png','windows-package.json','windows-installer-experience.json','windows-installer-progress.png','windows-installer-finish.png' | ForEach-Object { (Resolve-Path (Join-Path 'verification' $_)).Path }
          $files = @((Get-ChildItem release/windows/*-Setup.exe).FullName) + @((Get-ChildItem release/windows/*.sha256).FullName) + $reports + @('scripts/Publish-NubiUpdate.ps1','docs/WINDOWS-UPDATE-DEPLOYMENT.md','THIRD-PARTY-NOTICES.md')
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --prerelease --target $env:GITHUB_SHA --title "누비 Workspace Beta Windows x64 ($env:GITHUB_RUN_ID)" --notes "Standalone Electron installer and native Windows installation reports. Build $env:GITHUB_RUN_ID, commit $env:GITHUB_SHA. Unsigned Beta; corporate SSO, Office 2016/NASCA and Windows 11 end-user behavior are separate checks." @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save failed-check diagnostics in a private draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "nubi-desktop-diagnostics-$env:GITHUB_RUN_ID"
          New-Item verification -ItemType Directory -Force | Out-Null
          "Build $env:GITHUB_RUN_ID failed. See workflow logs for the failed gate." | Set-Content verification/failure.txt
          Compress-Archive -Path verification/* -DestinationPath verification/windows-diagnostics.zip
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --prerelease --target $env:GITHUB_SHA --title "Nubi Windows check diagnostics ($env:GITHUB_RUN_ID)" --notes "Isolated fixture diagnostics only. No installer is released from this failed check." verification/windows-diagnostics.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nubi-windows-diagnostics
          path: packages/nubi-desktop/verification/
          retention-days: 7
