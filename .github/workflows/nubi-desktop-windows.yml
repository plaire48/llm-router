name: Nubi Desktop Windows installer
on:
  push:
    branches: ['codex/nubi-desktop-windows-release*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
      - name: Verify Unicode shortcut inspection
        shell: pwsh
        run: ./scripts/Test-ShellLink.ps1
      - name: Verify native virtual cursor shape and user pointer isolation
        run: node scripts/check-visual-pointer.mjs
      - name: Verify real RunAs and elevated child exit before dependency installation
        run: node scripts/check-elevation.mjs
      - name: Install locked dependencies
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile runtime and check contracts
        run: |
          New-Item verification -ItemType Directory -Force | Out-Null
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        id: driver-cache
        with:
          path: packages/nubi-desktop/generated/winapp
          key: winapp-x64-d626d2b53b9eea27ae2972e9153ce0b1d4c52825-password-v1
      - uses: actions/checkout@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          repository: microsoft/winappCli
          ref: d626d2b53b9eea27ae2972e9153ce0b1d4c52825
          path: .build/winapp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare verified Windows driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/prepare-winapp.ps1
      - uses: actions/cache/save@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          path: packages/nubi-desktop/generated/winapp
          key: winapp-x64-d626d2b53b9eea27ae2972e9153ce0b1d4c52825-password-v1
      - name: Verify real Windows UIA
        run: |
          node scripts/check-winapp.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify host app launch, approved draft and native shells
        run: node scripts/check-windows-workflow.mjs
      - name: Build Windows installer
        run: npm run package:windows
      - name: Preserve candidate for reproducible installer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nubi-unverified-windows-candidate
          path: packages/nubi-desktop/release/windows/*-Setup.exe
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Download previous verified installer for upgrade coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'nubi-desktop-baseline'
          gh run download 35864493370 --repo plaire48/llm-router --name nubi-workspace-windows-x64 --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = Join-Path $baseline 'release/windows/Nubi-Workspace-0.1.1-x64-Setup.exe'
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLower() -ne '63d1ee88debe4bb5be9b7d1605e6421ed244d0160c76af2e8df4451c3cf751cb') { throw 'Baseline checksum mismatch' }
          "NUBI_BASELINE_INSTALLER=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install and verify packaged application
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: nubi-workspace-windows-x64
          path: |
            packages/nubi-desktop/release/windows/*-Setup.exe
            packages/nubi-desktop/release/windows/*.sha256
            packages/nubi-desktop/verification/electron-release.json
            packages/nubi-desktop/verification/windows-installer.json
            packages/nubi-desktop/verification/windows-branding.json
            packages/nubi-desktop/verification/installed-icon.png
            packages/nubi-desktop/verification/windows-uia.json
            packages/nubi-desktop/verification/windows-uia-visual-only.json
            packages/nubi-desktop/verification/windows-elevation.json
            packages/nubi-desktop/verification/windows-workflow.json
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-windows-diagnostics
          path: packages/nubi-desktop/verification/
