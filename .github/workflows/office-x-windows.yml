name: Office X Windows Beta
on:
  push:
    branches: ['codex/nubi-office-genoffice-0.3.0']
    paths: ['packages/office-x/**', '.github/workflows/office-x-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/office-x
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: NuGet/setup-nuget@v2
      - name: Build Windows installer
        run: ./scripts/Build-Windows.ps1 -InstallBuildTools
      - name: Install, reinstall and uninstall
        run: ./scripts/Test-WindowsInstall.ps1
      - name: Package source
        run: |
          python scripts/package-source.py
          Copy-Item artifacts/* releases/
      - name: Stage release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='office-x-v0.3.0-beta.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if($LASTEXITCODE){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title 'Nubi Office X 0.3.0 Beta 1' --notes-file RELEASE-NOTES.md}
          if($LASTEXITCODE){throw 'Release creation failed'}
          gh release upload $tag releases/Nubi-Office-X-0.3.0-Setup.exe releases/Nubi-Office-X-0.3.0-Setup.exe.sha256 releases/office-x-0.3.0-source.zip releases/office-x-0.3.0-source.json releases/installer-build.json releases/install-smoke.json --clobber --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE){throw 'Release upload failed'}
